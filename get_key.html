<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRIME MOD KEY - VIP PORTAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: #f8fafc;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .glow-box {
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.25), inset 0 0 20px rgba(16, 185, 129, 0.05);
    }
    .glow-btn-emerald {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.45);
    }
    .glow-btn-cyan {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-slate-950 via-slate-900 to-black select-none relative">

  <!-- Ambient Glow -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Card -->
  <div class="w-full max-w-sm bg-slate-900/90 border border-emerald-500/40 rounded-3xl p-6 sm:p-7 glow-box text-center relative overflow-hidden backdrop-blur-xl z-10">
    
    <div class="absolute -top-[1px] left-1/4 right-1/4 h-[2px] bg-gradient-to-r from-transparent via-emerald-400 to-transparent"></div>

    <!-- VIP Key Icon -->
    <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-950/80 border border-emerald-500/50 flex items-center justify-center text-emerald-400 mb-4 shadow-[0_0_30px_rgba(16,185,129,0.35)]">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
      </svg>
    </div>

    <!-- Title Badge -->
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/40 text-[10px] text-emerald-300 font-bold uppercase tracking-wider mb-2">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
      24H FREE PASS
    </div>

    <!-- Main Title -->
    <h1 class="text-2xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 tracking-wider">
      PRIME MOD KEY
    </h1>
    <p class="text-xs text-slate-400 mt-1 font-mono">
      Complete verification to unlock your free 24-hour key
    </p>

    <!-- ACTION BUTTONS -->
    <div class="mt-6 space-y-3">
      
      <!-- OPEN SHORTENER BUTTON -->
      <button type="button" id="btn-start-get-key" onclick="startVerificationFlow()" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-orbitron font-extrabold text-sm rounded-2xl glow-btn-emerald flex items-center justify-center gap-2.5 transition-all transform active:scale-95 cursor-pointer">
        <svg class="w-5 h-5 shrink-0 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span id="btn-text">OPEN SHORTENER</span>
      </button>

      <!-- OFFICIAL TELEGRAM BUTTON -->
      <a id="btn-tg-link" href="https://telegram.dog/PRIME_MODSX" target="_blank" class="w-full py-3.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-cyan-500/50 text-cyan-400 hover:text-cyan-300 font-orbitron font-bold text-xs rounded-2xl flex items-center justify-center gap-2.5 transition-all glow-btn-cyan">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        <span id="tg-btn-text">JOIN TELEGRAM</span>
      </a>

    </div>

    <!-- Minimal Tagline -->
    <div class="mt-5 text-[10px] text-slate-600 font-mono">
      POWERED BY <span class="text-cyan-400 font-bold">JAAT AUTH GATEWAY</span>
    </div>

  </div>

  <!-- Live Maintenance Modal -->
  <div id="modal-maintenance" class="fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="w-full max-w-[340px] bg-slate-900 border border-amber-500/60 rounded-3xl p-6 text-center shadow-[0_0_50px_rgba(245,158,11,0.3)]">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 border border-amber-500/60 flex items-center justify-center text-amber-400 mb-3 shadow-[0_0_25px_rgba(245,158,11,0.4)]">
        <svg class="w-7 h-7 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <div class="inline-block px-3 py-1 rounded-full bg-amber-950/80 border border-amber-500/40 text-[10px] text-amber-300 font-bold uppercase tracking-wider mb-2">MAINTENANCE</div>
      <h2 class="text-base font-bold font-orbitron text-amber-400">SERVER OFFLINE</h2>
      <p id="maint-msg" class="text-xs text-slate-300 mt-2">Free Key server is undergoing scheduled maintenance. Please join Telegram for updates.</p>
      <a id="maint-tg-btn" href="https://telegram.dog/PRIME_MODSX" target="_blank" class="mt-4 inline-flex w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-orbitron font-bold text-xs rounded-xl items-center justify-center gap-2">
        JOIN TELEGRAM
      </a>
    </div>
  </div>

  <script>
    const CONFIG = {
      workerUrl: "https://jaat-auth.hrrusher808.workers.dev",
      defaultTg: "https://telegram.dog/PRIME_MODSX"
    };

    let liveServerData = null;

    async function initPage() {
      try {
        const res = await fetch(`${CONFIG.workerUrl}/app/status?_t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        liveServerData = data;

        if (data.serverStatus === "maintenance") {
          showMaintenanceModal(data.maintenanceMsg, data.updateUrl);
          return;
        }

        if (data.updateUrl && data.updateUrl.trim()) {
          const tgBtn = document.getElementById('btn-tg-link');
          if (tgBtn) tgBtn.href = data.updateUrl.trim();
          const maintTgBtn = document.getElementById('maint-tg-btn');
          if (maintTgBtn) maintTgBtn.href = data.updateUrl.trim();
        }
      } catch(e) {
        console.warn("Server status check skipped:", e);
      }
    }

    function showMaintenanceModal(msg, tgUrl) {
      const modal = document.getElementById('modal-maintenance');
      const msgEl = document.getElementById('maint-msg');
      if (msg && msgEl) msgEl.innerText = msg;
      if (tgUrl) {
        const maintTgBtn = document.getElementById('maint-tg-btn');
        if (maintTgBtn) maintTgBtn.href = tgUrl;
      }
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
    }

    async function startVerificationFlow() {
      const btn = document.getElementById('btn-start-get-key');
      const btnText = document.getElementById('btn-text');

      const shortenerUrl = (liveServerData && liveServerData.getKeyUrl && liveServerData.getKeyUrl.trim())
        ? liveServerData.getKeyUrl.trim()
        : "";

      if (!shortenerUrl) {
        alert("SHORTENER NOT CONFIGURED!\n\nOwner ne abhi tak Dashboard me Shortener Link add nahi kiya hai. Kripya thoda intezar karein ya Telegram join karein!");
        return;
      }

      btn.disabled = true;
      btnText.innerText = "STARTING SESSION...";

      try {
        // Register verified pre-claim session on worker (Prevents bypass bots & direct link sharing!)
        await fetch(`${CONFIG.workerUrl}/api/init_free_session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: Date.now() })
        }).catch(() => {});
      } catch(e) {}

      btnText.innerText = "OPENING SHORTENER...";
      window.location.href = shortenerUrl;
    }

    initPage();
  </script>
</body>
</html>
