<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAAT OP KEY SYSTEM</title>
  <!-- Tailwind CSS for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #090a0f;
      color: #f3f4f6;
      overflow-x: hidden;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .glow-box {
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.18), inset 0 0 15px rgba(0, 242, 254, 0.05);
    }
    .glow-btn {
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transition: all 0.3s ease;
    }
    .glow-btn:hover {
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.85);
      transform: translateY(-2px);
    }
    .cyber-bg {
      background: radial-gradient(circle at 50% 20%, #1a1c29 0%, #090a0f 70%);
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .shake-anim {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
  </style>
</head>
<body class="cyber-bg min-h-screen flex items-center justify-center relative p-4 select-none">

  <!-- Background Ambient Glows -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 2s;"></div>

  <!-- Main Container -->
  <div class="relative z-10 w-full max-w-md mx-auto transition-all duration-300" id="mainContainer">
    
    <!-- Login Card -->
    <div id="login-card" class="bg-slate-900/80 backdrop-blur-xl border border-cyan-500/30 rounded-2xl p-8 glow-box transition-all duration-500">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-block p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 mb-4 text-cyan-400">
          <svg class="w-8 h-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
          </svg>
        </div>
        <h1 class="font-orbitron text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
          JAAT OP PORTAL
        </h1>
        <p class="text-xs text-cyan-400/80 mt-2 tracking-widest uppercase font-semibold">Admin &amp; Reseller Control Center</p>
      </div>

      <!-- Form -->
      <form id="key-form" onsubmit="verifyKey(event)" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2">Enter Admin / Reseller Key</label>
          <div class="relative">
            <input type="password" id="key-input" required placeholder="Enter Admin or Reseller Key..." autocomplete="off"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 pr-11 text-slate-200 placeholder-slate-600 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-slate-500 hover:text-cyan-400 transition-colors" title="Toggle visibility">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message Alert -->
        <div id="error-alert" class="hidden bg-red-950/60 border border-red-500/50 text-red-400 text-xs px-4 py-3 rounded-xl flex items-center space-x-2.5">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span id="error-text">Invalid Key! Please check and try again.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-orbitron font-bold rounded-xl glow-btn flex items-center justify-center space-x-2">
          <span id="btn-text">VERIFY &amp; LOGIN</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
          </svg>
        </button>
      </form>

      <!-- Footer info -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Protected by <span class="text-cyan-400 font-medium">JAAT OP Security Engine</span>
      </div>
    </div>

  </div>

  <!-- Dynamic Functional Key Engine -->
  <script>
    const KEY_SYSTEM_CONFIG = {
      workerUrl: "https://jaat-auth.hrrusher808.workers.dev",
      fallbackKeys: {
        "JAAT-VIP-999":    { tier: "VIP Lifetime", expires: "Never", status: "active" },
        "JAAT-PRO-2026":   { tier: "Lifetime Access", expires: "2030-12-31", status: "active" },
        "JAAT-7DAY-PASS":  { tier: "7-Day Pass", expires: "2026-12-31", status: "active" }
      },
      enableAutoLogin: true,
      storageKey: "JAAT_OP_KEY_SESSION"
    };

    let activeAdminKey = null;
    let activeRole = "owner";

    function getDeviceID() {
      let dev = localStorage.getItem("JAAT_DEVICE_ID");
      if (!dev) {
        dev = "JAAT-DEV-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
        localStorage.setItem("JAAT_DEVICE_ID", dev);
      }
      return dev;
    }

    function togglePassword() {
      const input = document.getElementById('key-input');
      const eyeIcon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
        `;
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    }

    async function validateKeyAgainstSources(inputKey) {
      inputKey = inputKey.trim();

      if (KEY_SYSTEM_CONFIG.workerUrl && !KEY_SYSTEM_CONFIG.workerUrl.includes("YOUR_SUBDOMAIN")) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(`${KEY_SYSTEM_CONFIG.workerUrl}/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: inputKey, deviceId: getDeviceID() }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.valid) {
              const isOwner = !!data.isOwner;
              const isReseller = !!data.isReseller || data.role === "reseller";

              if (!isOwner && !isReseller) {
                return {
                  valid: false,
                  message: "Access Denied. Administrative privileges required."
                };
              }

              return {
                valid: true,
                isOwner: isOwner,
                isReseller: isReseller,
                role: isOwner ? "owner" : "reseller",
                tier: data.tier || (isOwner ? "Owner Master" : "Reseller"),
                expires: data.expires || "Never"
              };
            } else {
              return { valid: false, message: data.message || "Invalid or expired key!" };
            }
          }
        } catch (err) {
          console.warn("[JAAT KEY] Cloudflare Worker timeout/offline, checking local fallback pool.");
        }
      }

      if (KEY_SYSTEM_CONFIG.fallbackKeys[inputKey]) {
        const info = KEY_SYSTEM_CONFIG.fallbackKeys[inputKey];
        if (info.tier !== "Reseller" && info.tier !== "Owner Master") {
          return {
            valid: false,
            message: "Access Denied. Administrative privileges required."
          };
        }
        return {
          valid: true,
          isOwner: info.tier === "Owner Master",
          isReseller: info.tier === "Reseller",
          role: info.tier === "Owner Master" ? "owner" : "reseller",
          tier: info.tier,
          expires: info.expires
        };
      }

      return { valid: false, message: "Invalid Key! Access Denied." };
    }

    async function verifyKey(event) {
      if (event) event.preventDefault();

      const keyInput = document.getElementById('key-input').value.trim();
      const errorAlert = document.getElementById('error-alert');
      const errorText = document.getElementById('error-text');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      if (!keyInput) return;

      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="animate-pulse">AUTHENTICATING...</span>';

      const validation = await validateKeyAgainstSources(keyInput);

      if (validation.valid) {
        errorAlert.classList.add('hidden');

        activeAdminKey = keyInput;
        activeRole = validation.role || (validation.isOwner ? "owner" : "reseller");

        const sessionData = {
          key: keyInput,
          isOwner: validation.isOwner,
          isReseller: validation.isReseller,
          role: activeRole,
          tier: validation.tier,
          expires: validation.expires,
          deviceId: getDeviceID(),
          loginTime: new Date().toLocaleString()
        };

        if (KEY_SYSTEM_CONFIG.enableAutoLogin) {
          localStorage.setItem(KEY_SYSTEM_CONFIG.storageKey, JSON.stringify(sessionData));
        }

        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="text-emerald-400 font-bold">ACCESS GRANTED! OPENING DASHBOARD...</span>';
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 350);
      } else {
        errorText.innerText = validation.message || "Invalid Key! Access Denied.";
        errorAlert.classList.remove('hidden');
        
        const card = document.getElementById('login-card');
        card.classList.remove('shake-anim');
        void card.offsetWidth;
        card.classList.add('shake-anim');

        submitBtn.disabled = false;
        btnText.innerHTML = 'VERIFY &amp; LOGIN';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (KEY_SYSTEM_CONFIG.enableAutoLogin) {
        const saved = localStorage.getItem(KEY_SYSTEM_CONFIG.storageKey);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && (parsed.isOwner || parsed.isReseller)) {
              window.location.href = "dashboard.html";
            } else {
              localStorage.removeItem(KEY_SYSTEM_CONFIG.storageKey);
            }
          } catch (e) {
            localStorage.removeItem(KEY_SYSTEM_CONFIG.storageKey);
          }
        }
      }
    });
  </script>
</body>
</html>
